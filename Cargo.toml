[package]
name = "ada-url"
authors = [
   "Yagiz Nizipli <yagiz@nizipli.com>",
   "Daniel Lemire <daniel@lemire.me>",
   "LongYinan <github@lyn.one>",
   "Boshen <boshenc@gmail.com>",
   "Diaconu Radu-Mihai <52667211+countradooku@users.noreply.github.com>"
 ]
version = "4.0.0"
edition = "2024"
description = "Fast WHATWG Compliant URL parser"
documentation = "https://docs.rs/ada-url"
readme = "README.md"
keywords = ["url", "parser", "whatwg", "performance"]
categories = ["parser-implementations", "web-programming", "encoding", "parsing", "no-std"]
repository = "https://github.com/ada-url/rust"
homepage = "https://ada-url.com"
license = "MIT OR Apache-2.0"

[[bench]]
name = "parse"
path = "bench/parse.rs"
harness = false

[[bench]]
name = "bbc"
path = "bench/bbc.rs"
harness = false

[[bench]]
name = "search_params"
path = "bench/search_params.rs"
harness = false

[[bench]]
name = "ipv4"
path = "bench/ipv4.rs"
harness = false

[[bench]]
name = "scheme"
path = "bench/scheme.rs"
harness = false

[[bench]]
name = "wpt"
path = "bench/wpt.rs"
harness = false

[features]
default = ["std"]
# Kept as no-op compatibility features for downstream manifests which selected
# the former C++ implementation's build modes.
bundled = []
libcpp = []
# enables serde serialization/deserialization support
serde = ["dep:serde", "std"]
# enable allocations
std = ["url/std"]
url-pattern = ["dep:urlpattern", "std"]

[dependencies]
idna = "1.1.0"
memchr = "2.8.0"
percent-encoding = "2.3.2"
serde = { version = "1", optional = true, features = ["derive"] }
url = { version = "2.5.8", default-features = false }
urlpattern = { version = "0.6.0", optional = true }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "4", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.docs.rs]
features = ["serde", "url-pattern"]

[package.metadata.playground]
features = ["serde"]
